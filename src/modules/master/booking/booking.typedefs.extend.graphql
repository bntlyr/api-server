  coatingDefect: CoatingDefect
  castingDefect: CastingDefect
  prefinDefect: PrefinDefect
  fabDefect: FabDefect
  mimDefect: MimDefect
}

type RemakeEligibilityResult {
  salesOrderId: Int!
  orderNo: String!
  orderQty: Float!
  allocatedQty: Float!
  netDemand: Float!
  totalOriginalScheduledQty: Float!
  scrapBufferQty: Float!
  totalCumulativeRejects: Float!
  isRemakeEligible: Boolean!
  shortfallQty: Float!
  suggestedRemakeQty: Float!
}

extend type Query {
  checkRemakeEligibility(salesOrderId: Int!): RemakeEligibilityResult!
}

extend type Mutation {
  bookProcessWithDefects(input: BookingExecutionInput!): BookingPayload!
}
