}

extend type Process {
  itemPictures: [ItemPicture!]!
}

extend type Process {
  processIterations: [ProcessIteration!]!
}

extend type Process {
  processMachinings: [ProcessMachining!]!
}

extend type Process {
  defaultRouteSteps: [DefaultRouteStep!]!
}

extend type Process {
